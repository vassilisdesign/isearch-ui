<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>%TITLE%</title>
  <meta name="description" content="%DESC%">
  <meta name="theme-color" content="#EDEFEE">
  <meta property="og:type" content="website">
  <meta property="og:title" content="%TITLE%">
  <meta property="og:description" content="%DESC%">
  <link rel="icon" type="image/svg+xml" href="./src/favicon.svg">
  <script>
    /* Runs before first paint: sets up motion and language state, and never leaves content hidden. */
    (function (d, w) {
      var h = d.documentElement;
      h.classList.add('js');
      try { var l = localStorage.getItem('vd-lang'); if (l === 'el' || l === 'en') h.lang = l; } catch (e) {}
      if (w.matchMedia && w.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      h.classList.add('intro');
      try { if (sessionStorage.getItem('vd-wipe')) h.classList.add('is-wiping'); } catch (e) {}
      setTimeout(function () { if (!w.__vd) h.classList.remove('intro', 'is-wiping'); }, 4000);
    })(document, window);
  </script>
</head>
<body id="top" data-slug="">
  <!--render:header-->
  <main id="main" tabindex="-1"><!--render:main--></main>
  <!--render:footer-->
  <script type="module" src="./src/main.js"></script>
</body>
</html>
